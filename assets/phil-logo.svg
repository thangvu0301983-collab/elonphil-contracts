<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="space" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#3a2466"/>
      <stop offset="1" stop-color="#140b2a"/>
    </radialGradient>
    <radialGradient id="mars" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#f08a4b"/>
      <stop offset="1" stop-color="#b8401c"/>
    </radialGradient>
    <radialGradient id="skin" cx="45%" cy="35%" r="75%">
      <stop offset="0" stop-color="#ffd9b8"/>
      <stop offset="1" stop-color="#f0b48c"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4c357"/>
      <stop offset="1" stop-color="#d9962a"/>
    </linearGradient>
    <clipPath id="inner"><circle cx="500" cy="500" r="318"/></clipPath>
    <path id="topArc" d="M 118 520 A 382 382 0 0 1 882 520"/>
    <path id="ribbonArc" d="M 250 812 Q 500 880 750 812"/>
    <g id="star"><path d="M0 -18 L5.3 -5.6 L18 -5.6 L7.8 2.2 L11.6 15 L0 7.4 L-11.6 15 L-7.8 2.2 L-18 -5.6 L-5.3 -5.6 Z"/></g>
  </defs>

  <!-- badge rings -->
  <circle cx="500" cy="500" r="492" fill="#f2b233" stroke="#5e0c0e" stroke-width="10"/>
  <circle cx="500" cy="500" r="468" fill="#a3161a"/>
  <circle cx="500" cy="500" r="452" fill="none" stroke="#f2b233" stroke-width="5"/>
  <circle cx="500" cy="500" r="330" fill="#f2b233" stroke="#5e0c0e" stroke-width="6"/>

  <!-- ring stars -->
  <g fill="#f2b233">
    <use href="#star" x="128" y="420"/><use href="#star" x="112" y="520"/><use href="#star" x="128" y="620"/>
    <use href="#star" x="872" y="420"/><use href="#star" x="888" y="520"/><use href="#star" x="872" y="620"/>
  </g>

  <!-- top title -->
  <text font-family="'Arial Black','Segoe UI Black',Impact,sans-serif" font-size="96" font-weight="900" letter-spacing="4"
        fill="#fff3d6" stroke="#3a0708" stroke-width="10" paint-order="stroke" text-anchor="middle">
    <textPath href="#topArc" startOffset="50%">ELON PHIL XXXL</textPath>
  </text>

  <!-- inner scene -->
  <g clip-path="url(#inner)">
    <rect x="150" y="150" width="700" height="700" fill="url(#space)"/>
    <g fill="#fff7dd">
      <circle cx="270" cy="270" r="4"/><circle cx="330" cy="215" r="3"/><circle cx="415" cy="190" r="2.5"/>
      <circle cx="245" cy="380" r="3"/><circle cx="600" cy="205" r="3"/><circle cx="760" cy="420" r="3.5"/>
      <circle cx="300" cy="460" r="2.5"/><circle cx="720" cy="520" r="2.5"/><circle cx="565" cy="250" r="2"/>
    </g>
    <!-- Mars -->
    <circle cx="700" cy="300" r="62" fill="url(#mars)"/>
    <ellipse cx="685" cy="285" rx="13" ry="9" fill="#a83a19" opacity=".7"/>
    <ellipse cx="722" cy="320" rx="9" ry="7" fill="#a83a19" opacity=".7"/>
    <ellipse cx="672" cy="330" rx="6" ry="5" fill="#a83a19" opacity=".6"/>
    <!-- little rocket heading to Mars -->
    <g transform="translate(300 300) rotate(62)">
      <path d="M0 -26 C10 -16 12 0 9 14 L-9 14 C-12 0 -10 -16 0 -26 Z" fill="#fff3d6" stroke="#3a0708" stroke-width="3"/>
      <circle cx="0" cy="-6" r="4.5" fill="#4aa3d8" stroke="#3a0708" stroke-width="2"/>
      <path d="M-9 8 L-16 20 L-8 16 Z M9 8 L16 20 L8 16 Z" fill="#a3161a"/>
      <path d="M-5 15 L0 30 L5 15 Z" fill="#f2b233"/>
    </g>

    <!-- body: belly -->
    <ellipse cx="505" cy="760" rx="190" ry="150" fill="url(#skin)" stroke="#5a2a14" stroke-width="5"/>
    <path d="M495 760 q8 6 0 12" fill="none" stroke="#b7724a" stroke-width="5" stroke-linecap="round"/>
    <!-- shoulders / vest (cropped, belly shows) -->
    <path d="M330 640 C335 575 380 545 430 535 L570 535 C620 545 665 575 672 640 L680 700 C610 722 400 722 322 700 Z"
          fill="#efe3c8" stroke="#5a2a14" stroke-width="5"/>
    <path d="M326 676 C410 698 600 698 676 676" fill="none" stroke="#1f4d3a" stroke-width="9"/>
    <path d="M324 694 C410 716 600 716 678 694" fill="none" stroke="#1f4d3a" stroke-width="6"/>
    <!-- V neck with stripes -->
    <path d="M440 537 L500 625 L560 537" fill="#fffaf0" stroke="#5a2a14" stroke-width="4"/>
    <path d="M432 540 L500 640 L568 540" fill="none" stroke="#1f4d3a" stroke-width="8"/>
    <path d="M420 542 L500 657 L580 542" fill="none" stroke="#1f4d3a" stroke-width="5"/>
    <!-- polo collar -->
    <path d="M455 520 L500 560 L470 575 Z M545 520 L500 560 L530 575 Z" fill="#fffaf0" stroke="#5a2a14" stroke-width="4" stroke-linejoin="round"/>

    <!-- guard arm (right side) -->
    <path d="M640 600 C700 610 700 540 660 505" fill="none" stroke="#5a2a14" stroke-width="64" stroke-linecap="round"/>
    <path d="M640 600 C700 610 700 540 660 505" fill="none" stroke="url(#skin)" stroke-width="54" stroke-linecap="round"/>
    <circle cx="652" cy="490" r="40" fill="url(#skin)" stroke="#5a2a14" stroke-width="5"/>
    <path d="M630 478 q22 -8 44 0 M628 494 q24 -6 48 0" fill="none" stroke="#b7724a" stroke-width="4" stroke-linecap="round"/>

    <!-- head -->
    <ellipse cx="500" cy="420" rx="100" ry="104" fill="url(#skin)" stroke="#5a2a14" stroke-width="5"/>
    <!-- ears -->
    <!-- hair: bob with straight bangs -->
    <path d="M392 470 C370 380 400 300 500 292 C600 300 630 380 608 470 L592 470 C596 430 590 400 580 382 L420 382 C410 400 404 430 408 470 Z"
          fill="url(#hair)" stroke="#8a5a14" stroke-width="5" stroke-linejoin="round"/>
    <path d="M412 384 C440 376 560 376 588 384" fill="none" stroke="#8a5a14" stroke-width="5"/>
    <g stroke="#b97f1f" stroke-width="3.5" fill="none" stroke-linecap="round">
      <path d="M440 310 C430 340 428 360 432 380"/><path d="M475 300 C468 330 466 355 468 380"/>
      <path d="M520 300 C526 330 528 355 528 380"/><path d="M560 312 C570 340 572 360 568 380"/>
      <path d="M402 400 C398 425 398 445 402 468"/><path d="M598 400 C602 425 602 445 598 468"/>
    </g>
    <!-- face -->
    <path d="M448 402 L482 412" stroke="#5a3210" stroke-width="9" stroke-linecap="round"/>
    <path d="M552 402 L518 412" stroke="#5a3210" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="466" cy="430" rx="11" ry="13" fill="#fff"/><circle cx="469" cy="432" r="7" fill="#24160f"/><circle cx="471" cy="429" r="2.2" fill="#fff"/>
    <ellipse cx="534" cy="430" rx="11" ry="13" fill="#fff"/><circle cx="531" cy="432" r="7" fill="#24160f"/><circle cx="533" cy="429" r="2.2" fill="#fff"/>
    <path d="M500 438 C492 458 494 466 506 466" fill="none" stroke="#b7724a" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="445" cy="468" rx="18" ry="10" fill="#f28c7a" opacity=".55"/>
    <ellipse cx="555" cy="468" rx="18" ry="10" fill="#f28c7a" opacity=".55"/>
    <path d="M468 488 C490 500 518 498 536 482" fill="#7a2418" stroke="#5a2a14" stroke-width="5" stroke-linecap="round"/>
    <path d="M478 491 L528 488" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

    <!-- jab arm: comes toward the viewer -->
    <path d="M375 600 C350 590 330 580 318 566" fill="none" stroke="#5a2a14" stroke-width="86" stroke-linecap="round"/>
    <path d="M375 600 C350 590 330 580 318 566" fill="none" stroke="url(#skin)" stroke-width="76" stroke-linecap="round"/>
    <path d="M345 545 C360 585 395 615 415 610" fill="none" stroke="#fffaf0" stroke-width="0"/>
    <circle cx="300" cy="548" r="78" fill="url(#skin)" stroke="#5a2a14" stroke-width="6"/>
    <g fill="none" stroke="#b7724a" stroke-width="5" stroke-linecap="round">
      <path d="M248 520 q26 -14 52 -4"/><path d="M244 548 q30 -12 60 -2"/><path d="M248 576 q28 -10 56 0"/>
      <path d="M318 498 q22 18 18 58"/>
    </g>
    <!-- motion lines -->
    <g stroke="#fff3d6" stroke-width="7" stroke-linecap="round" opacity=".9">
      <path d="M200 470 L232 488"/><path d="M190 548 L218 548"/><path d="M200 626 L232 608"/>
    </g>
  </g>
  <circle cx="500" cy="500" r="318" fill="none" stroke="#5e0c0e" stroke-width="6"/>

  <!-- bottom ribbon -->
  <path d="M140 770 L230 760 L215 815 L240 870 L130 862 L165 815 Z" fill="#7a0f12" stroke="#3a0708" stroke-width="5" stroke-linejoin="round"/>
  <path d="M860 770 L770 760 L785 815 L760 870 L870 862 L835 815 Z" fill="#7a0f12" stroke="#3a0708" stroke-width="5" stroke-linejoin="round"/>
  <path d="M210 752 Q500 840 790 752 L790 852 Q500 940 210 852 Z" fill="#c21d22" stroke="#3a0708" stroke-width="6" stroke-linejoin="round"/>
  <path d="M222 770 Q500 856 778 770" fill="none" stroke="#f2b233" stroke-width="4"/>
  <path d="M222 836 Q500 922 778 836" fill="none" stroke="#f2b233" stroke-width="4"/>
  <text font-family="'Arial Black','Segoe UI Black',Impact,sans-serif" font-size="64" font-weight="900" letter-spacing="3"
        fill="#fff3d6" stroke="#3a0708" stroke-width="8" paint-order="stroke" text-anchor="middle" dy="22">
    <textPath href="#ribbonArc" startOffset="50%">JAB TO MARS</textPath>
  </text>
</svg>
